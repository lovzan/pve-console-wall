name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: bash test/run-tests.sh

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dpkg-dev fakeroot

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp ../pve-console-wall_*_all.deb dist/ || true
          ls -l dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-console-wall-deb
          path: dist/*.deb

      # On a version tag, publish the .deb to a GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
